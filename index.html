<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kristina Catherine McInnis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: one centered card on a soft stone ground — portrait, name, socials, sticky section pills, then swipeable two-row tile carousels per section. */
:root{
  --ground:#DAD5CF;
  --card:#F5F2EE;
  --tile:#E4DED6;
  --tilehover:#DAD2C8;
  --ink:#141210;
  --sub:#5C554E;
  --line:#E0D9D0;
  --accent:#7A5F3A;
  --sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --serif:"Instrument Serif","Didot",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:radial-gradient(120% 80% at 50% 0%,#E9E5E0,var(--ground));background-color:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--card)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.outer{padding-block:28px 40px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.card{max-width:580px;margin:0 auto;background:var(--card);border-radius:14px;box-shadow:0 20px 60px -30px rgba(40,30,20,.35);padding-block:0 32px;overflow:hidden}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* Header */
.head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.portrait{width:100%;aspect-ratio:2/3;max-height:min(88vh,860px);max-width:100%;overflow:hidden;background:linear-gradient(160deg,#CFC4B6,#A8977F);display:grid;place-items:center;position:relative}
.portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(245,242,238,0) 62%,rgba(245,242,238,.6) 82%,var(--card) 98%);pointer-events:none}
.head{position:relative;z-index:1;margin-top:-92px}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .mono{font-family:var(--serif);font-style:italic;font-size:64px;color:rgba(255,255,255,.92);letter-spacing:.02em}
h1{font-size:clamp(28px,7.6vw,42px);font-weight:600;letter-spacing:-.03em;line-height:1.08;margin:0;text-wrap:balance;color:var(--ink)}
.tag{margin:0;color:var(--sub);font-size:15.5px;max-width:34ch}
.socials{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.socials a{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;letter-spacing:.02em;background:var(--ink);color:var(--card);transition:transform .2s,background .2s}
.socials a:hover{transform:translateY(-2px);background:var(--accent)}
.updated{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.updated i{width:6px;height:6px;border-radius:50%;background:#5E8A5A;display:inline-block}

/* Sticky pills */
.pills{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);margin-top:22px;border-bottom:1px solid var(--line)}
.pills .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.pills .row::-webkit-scrollbar{display:none}
.pills a{flex:none;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:999px;color:var(--sub);transition:background .2s,color .2s}
.pills a.on{background:var(--ink);color:var(--card)}

/* Sections */
section{padding-top:26px;scroll-margin-top:64px}
section + section{border-top:1px solid var(--line);margin-top:26px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h2{font-size:21px;font-weight:600;letter-spacing:-.015em;margin:0}
.arrows{display:flex;gap:4px}
.arrows button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:18px;line-height:1;transition:background .2s}
.arrows button:hover{background:var(--tile)}

/* Two-row tile carousel */
.rail{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:min(80%,300px);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
.rail.one{grid-template-rows:auto}
.rail::-webkit-scrollbar{display:none}
.tile{scroll-snap-align:start;display:flex;align-items:center;gap:14px;background:var(--tile);border-radius:10px;overflow:hidden;min-height:96px;transition:background .2s,transform .2s;text-align:left;border:0;padding:0;cursor:pointer;width:100%}
.tile:hover{background:var(--tilehover)}
.tile:active{transform:scale(.985)}
.thumb{flex:none;width:96px;align-self:stretch;min-height:96px;display:grid;place-items:center;background:var(--tone,#C9BBA8);color:rgba(255,255,255,.95);font-family:var(--serif);font-style:italic;font-size:26px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.tl{min-width:0;padding:12px 14px 12px 0;display:flex;flex-direction:column;gap:2px}
.tl strong{font-size:15.5px;font-weight:600;line-height:1.25}
.tl small{font-size:13px;color:var(--sub)}
.tl .codechip{align-self:flex-start;margin-top:4px;font-size:11.5px;font-weight:600;letter-spacing:.08em;padding:3px 8px;border-radius:5px;background:var(--card);border:1px dashed var(--accent);color:var(--accent)}

/* Product cards */
.prod{scroll-snap-align:start;display:flex;flex-direction:column;background:var(--tile);border-radius:10px;overflow:hidden;transition:background .2s}
.prod:hover{background:var(--tilehover)}
.prod .ph{aspect-ratio:1;max-width:100%;background:var(--tone,#C9BBA8);display:grid;place-items:center;color:rgba(255,255,255,.95);font-family:var(--serif);font-style:italic;font-size:34px;overflow:hidden}
.prod .ph img{width:100%;height:100%;object-fit:cover;display:block}
.prod .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.prod .b{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
.prod .i{font-size:15px;font-weight:500;line-height:1.3}
.prod .p{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.prod .go{margin-top:10px;align-self:flex-start;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--ink);color:var(--card)}
.rail.prods{grid-template-rows:auto;grid-auto-columns:min(46%,200px)}

/* Feature banner */
.feature{display:flex;flex-direction:column;gap:6px;background:var(--ink);color:var(--card);border-radius:12px;padding:20px 20px 18px}
.feature .k{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#CDB78F}
.feature h3{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.05;margin:2px 0}
.feature p{margin:0;color:#D8D1C6;font-size:14.5px}
.feature .go{margin-top:12px;align-self:flex-start;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;background:var(--card);color:var(--ink)}

/* Footer */
.collab{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--tile);border-radius:10px;padding:16px}
.collab .m{min-width:0;font-weight:600;font-size:15px;overflow-wrap:anywhere;user-select:all}
.collab button{flex:none;border:0;border-radius:999px;background:var(--ink);color:var(--card);font-size:13px;font-weight:600;padding:8px 14px;cursor:pointer}
.disc{margin:18px 0 0;text-align:center;font-size:12px;color:var(--sub)}
.sample{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:#EFE3CC;color:var(--accent)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--card);padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:14px;transition:opacity .25s,transform .25s;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast a{font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* Featured post with photo */
.feature{flex-direction:row;align-items:stretch;gap:0;padding:0;overflow:hidden}
.fimg{flex:none;width:132px;background:#2A2420;overflow:hidden}
.fimg img{width:100%;height:100%;object-fit:cover;display:block}
.ftext{display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;min-width:0}
.portrait img{object-position:center 30%}
.socials a{width:32px;height:32px}
.socials{gap:12px}
.socials a:has(img){background:transparent}
.socials a img{width:100%;height:100%;display:block}
.socials a:hover:has(img){background:transparent}
.cta{display:flex;align-items:stretch;background:var(--tile);border-radius:12px;overflow:hidden;transition:background .2s}
.cta:hover{background:var(--tilehover)}
.ctaimg{flex:none;width:34%;max-width:170px;overflow:hidden}
.ctaimg img{width:100%;height:100%;object-fit:cover;display:block}
.ctat{display:flex;flex-direction:column;gap:6px;padding:16px;min-width:0}
.ctat .k{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ctat strong{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.1;text-wrap:balance}
.ctat small{font-size:13.5px;color:var(--sub);line-height:1.4}
.ctat .go{margin-top:6px;align-self:flex-start;font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;background:var(--ink);color:var(--card)}
.covers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cover{display:flex;flex-direction:column;background:var(--tile);border-radius:12px;overflow:hidden;transition:background .2s,transform .2s;min-width:0}
.cover:hover{background:var(--tilehover);transform:translateY(-2px)}
.cimg{aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:var(--tone);overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover;display:block}
.cl{padding:10px 10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cl strong{font-size:14px;font-weight:600;line-height:1.2}
.cl small{font-size:12px;color:var(--sub);line-height:1.3}
</style>

<div class="outer">
<main class="card">
  <div class="portrait" id="portrait"><span class="mono">KCM</span></div>
  <header class="head pad">
    <h1 id="name">Kristina Catherine McInnis</h1>
    <nav class="socials" id="socials" aria-label="Social profiles"></nav>
  </header>

  <nav class="pills pad" aria-label="Sections"><div class="row" id="pills"></div></nav>

  <div class="pad" id="sections">
    <section id="top" style="padding-top:20px">
      <a class="feature" id="feature" target="_blank" rel="noopener">
        <span class="fimg" id="f-img"></span>
        <span class="ftext"><span class="k" id="f-k"></span><h3 id="f-t"></h3><p id="f-b"></p><span class="go">Shop the post</span></span>
      </a>
    </section>
  </div>

  <div class="pad">
    <section id="work">
      <div class="sh"><h2>Work with me</h2></div>
      <div class="collab"><span class="m" id="mail"></span><button id="copymail">Copy email</button></div>
      <p class="disc">Some links are affiliate links. I may earn a commission at no extra cost to you.</p>
    </section>
  </div>
</main>
</div>
<div class="toast" id="toast" role="status"><span id="toast-t"></span><a id="toast-a" target="_blank" rel="noopener" hidden></a></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const X = 'target="_blank" rel="noopener"';
const TONES = ['#CDBFAE','#BCA993','#D8CDBF','#AE9C86','#C4B39D'];
const initials = s => String(s||'').replace(/[^A-Za-z0-9 ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const pic = (o, cls, i) => `<span class="${cls}" style="--tone:${TONES[i%5]}">${o.image ? `<img src="${esc(o.image)}" alt="" loading="lazy">` : esc(initials(o.brand||o.name))}</span>`;
const arrows = id => `<div class="arrows" data-rail="${id}"><button aria-label="Previous" data-d="-1">‹</button><button aria-label="Next" data-d="1">›</button></div>`;
const fmt = d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});

function section(s){
  const rid = 'r-'+s.id; let rail='';
  if (s.kind === 'cta') return `<section id="${esc(s.id)}"><div class="sh"><h2>${esc(s.title)}</h2></div><a class="cta" href="${esc(s.url)}" ${X}>${s.image ? `<span class="ctaimg"><img src="${esc(s.image)}" alt=""></span>` : ''}<span class="ctat"><span class="k">${esc(s.kicker)}</span><strong>${esc(s.heading)}</strong><small>${esc(s.body)}</small><span class="go">${esc(s.button)} →</span></span></a></section>`;
  if (s.kind === 'covers') return `<section id="${esc(s.id)}"><div class="sh"><h2>${esc(s.title)}</h2></div><div class="covers">` + s.items.map((t,i) => `<a class="cover" href="${esc(t.url)}" ${X}>${pic(t,'cimg',i)}<span class="cl"><strong>${esc(t.name)}</strong><small>${esc(t.note)}</small></span></a>`).join('') + '</div></section>';
  if (s.kind === 'products') rail = `<div class="rail prods" id="${rid}">` + s.items.map((n,i) => `<a class="prod" href="${esc(n.url)}" ${X}>${pic(n,'ph',i)}<span class="meta"><span class="b">${esc(n.brand)}</span><span class="i">${esc(n.item)}</span><span class="p">${esc(n.price)}</span><span class="go">Shop</span></span></a>`).join('') + '</div>';
  else if (s.kind === 'codes') rail = `<div class="rail" id="${rid}">` + s.items.map((c,i) => `<button class="tile" data-code="${esc(c.code)}" data-brand="${esc(c.brand)}" data-url="${esc(c.url)}" data-label="${esc(c.cta || 'Shop '+c.brand)}">${pic(c,'thumb',i)}<span class="tl"><strong>${esc(c.brand)}</strong><small>${esc(c.note || 'Use my code at checkout')}</small><span class="codechip">${esc(c.code)} · Tap to copy</span></span></button>`).join('') + '</div>';
  else rail = `<div class="rail" id="${rid}">` + s.items.map((t,i) => `<a class="tile" href="${esc(t.url)}" ${X}>${pic(t,'thumb',i)}<span class="tl"><strong>${esc(t.name)}</strong><small>${esc(t.date ? fmt(t.date)+' · '+t.note : t.note)}</small></span></a>`).join('') + '</div>';
  return `<section id="${esc(s.id)}"><div class="sh"><h2>${esc(s.title)}</h2>${arrows(rid)}</div>${rail}</section>`;
}

function render(d){
  const p = d.profile || {};
  $('#name').textContent = p.name;
  if (p.photo) $('#portrait').innerHTML = `<img src="${esc(p.photo)}" alt="${esc(p.name)}">`;
  $('#mail').textContent = p.email || '';
  $('#socials').innerHTML = (d.socials||[]).map(s => `<a href="${esc(s.url)}" ${X} aria-label="${esc(s.name)}" title="${esc(s.name)} ${esc(s.handle)}">${s.icon ? `<img src="${esc(s.icon)}" alt="">` : esc(s.abbr || s.name[0])}</a>`).join('');

  const f = d.featured || {};
  $('#feature').href = f.url || '#'; $('#f-k').textContent = f.kicker||''; $('#f-t').textContent = f.title||''; $('#f-b').textContent = f.blurb||'';
  $('#f-img').innerHTML = f.image ? `<img src="${esc(f.image)}" alt="">` : '';

  $('#sections').insertAdjacentHTML('beforeend', (d.sections||[]).map(section).join(''));
  $('#pills').innerHTML = (d.sections||[]).map(s => `<a href="#${esc(s.id)}">${esc(s.title)}</a>`).join('') + '<a href="#work">Work with me</a>';
  spy();
}

let tt;
function toast(text, link, label){
  $('#toast-t').textContent = text;
  const a = $('#toast-a'); a.hidden = !link; if (link){ a.href = link; a.textContent = label; }
  $('#toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(()=>$('#toast').classList.remove('show'), 4200);
}
function copy(text, ok, fail){ try { navigator.clipboard.writeText(text).then(ok, fail); } catch { fail(); } }

document.addEventListener('click', e => {
  const c = e.target.closest('[data-code]');
  if (c){ const code=c.dataset.code;
    copy(code, () => toast(`${code} copied`, c.dataset.url, `${c.dataset.label} →`), () => toast(`Your code: ${code}`, c.dataset.url, `${c.dataset.label} →`)); return; }
  const ar = e.target.closest('.arrows button');
  if (ar){ const r = document.getElementById(ar.parentElement.dataset.rail); r.scrollBy({left: ar.dataset.d * r.clientWidth * .85, behavior:'smooth'}); return; }
  if (e.target.id === 'copymail'){ const m=$('#mail').textContent; copy(m, ()=>toast('Email copied'), ()=>toast(m)); }
});

function spy(){
  const pills = [...document.querySelectorAll('#pills a')];
  if (!pills.length) return; pills[0].classList.add('on');
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ pills.forEach(p => p.classList.toggle('on', p.getAttribute('href') === '#'+en.target.id)); const row=$('#pills'), on=pills.find(p=>p.classList.contains('on')); if(on) row.scrollTo({left:on.offsetLeft-row.clientWidth/2+on.clientWidth/2,behavior:'smooth'}); } }), {rootMargin:'-40% 0px -55% 0px'});
  document.querySelectorAll('section[id]').forEach(s => s.id!=='top' && io.observe(s));
}

fetch('data.json', {cache:'no-store'}).then(r => r.json()).then(render).catch(() => {});
</script>

</body>
</html>
